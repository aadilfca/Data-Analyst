<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Columns</title>
    <link rel="stylesheet" href="/static/style.css?v=11">
</head>

<body data-nav-module="Manage Columns" data-nav-parent="setup.html">
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- Populated by renderNavLeft() in client_context.js: back arrow + 🏢 home link + brand text. -->
            <div id="navLeft"></div>
            <div class="nav-client" id="clientControl">
                <!-- Will be rendered by client_context.js -->
            </div>
            <div class="nav-user"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <header class="module-header">
            <a href="/static/setup.html" class="back-link">← Back to Setup</a>
            <h1>📋 Manage Columns</h1>
            <p>Add, edit, or delete master columns used across the system</p>
        </header>

        <!-- Toolbar -->
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
            <button id="addColumnBtn" class="btn-upload" style="background:#3b82f6; padding:10px 25px;">➕ Add New
                Column</button>
            <span id="totalColumnsLabel" style="font-size:14px; color:#64748b; align-self:center;">Total: <strong
                    id="totalCount">0</strong> columns</span>
        </div>

        <!-- Search Field -->
        <div style="margin-bottom:20px;">
            <input type="text" id="columnSearchInput" placeholder="Search by Column Name, Type or Category"
                style="width:100%; padding:10px 14px; border:2px solid #e2e8f0; border-radius:8px; font-size:14px; transition:border-color 0.2s; max-width:500px;">
        </div>

        <!-- Columns Table -->
        <div style="background:white; border-radius:16px; overflow:auto; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
            <table id="columnsTable" style="width:100%; border-collapse:collapse; font-size:14px;">
                <thead style="background:#f8fafc; border-bottom:2px solid #e2e8f0;">
                    <tr>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="id" class="sortable">
                            ID <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="column_name"
                            class="sortable">
                            Column Name <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="data_type"
                            class="sortable">
                            Data Type <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="category"
                            class="sortable">
                            Category <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:center; cursor:pointer;" data-sort="is_active"
                            class="sortable">
                            Active <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:center; cursor:default;">Actions</th>
                    </tr>
                </thead>
                <tbody id="columnsBody">
                    <!-- Rows inserted by JavaScript -->
                </tbody>
            </table>
            <div id="noColumnsMessage" style="padding:30px; text-align:center; color:#94a3b8; display:none;">
                No columns found. Click "Add New Column" to create one.
            </div>
        </div>

        <!-- Status Message -->
        <div id="columnStatus" class="upload-status" style="margin-top:20px; display:none;"></div>
    </div>

    <!-- ============================================= -->
    <!-- ADD / EDIT COLUMN MODAL -->
    <!-- ============================================= -->
    <div id="columnModalOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;">
    </div>

    <div id="columnModal"
        style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:30px; z-index:1000; min-width:400px; max-width:600px; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <h2 id="modalTitle">Add New Column</h2>
        <form id="columnForm">
            <div style="margin-bottom:15px;">
                <label><strong>Column Name *</strong></label>
                <input type="text" id="colName" placeholder="e.g., Invoice Number" required
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
            </div>
            <div style="margin-bottom:15px;">
                <label><strong>Data Type *</strong></label>
                <select id="colType" required
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
                    <option value="Text">Text</option>
                    <option value="Numeric">Numeric</option>
                    <option value="Date">Date</option>
                </select>
            </div>
            <div style="margin-bottom:15px;">
                <label><strong>Category</strong></label>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="colCategory" placeholder="e.g., Financial"
                        style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
                    <select id="categoryDropdown"
                        style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
                        <option value="">-- Select existing --</option>
                    </select>
                </div>
                <small style="color:#94a3b8;">You can type a new category or select one from the dropdown.</small>
            </div>
            <div style="margin-bottom:15px;">
                <label><strong>Notes / Interpretation (optional)</strong></label>
                <textarea id="colNotes" placeholder="e.g., Must be named exactly 'Rate' for auto-detection in Purchase Order/Store Receiving/Vendor Bill" rows="3"
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px; font-family:inherit; resize:vertical;"></textarea>
            </div>
            <div id="columnUsagePreview" style="display:none; margin-bottom:15px; padding:8px 10px; background:#f8fafc; border-radius:4px; font-size:13px; color:#64748b;"></div>
            <input type="hidden" id="editColumnId" value="">
            <div
                style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
                <button type="button" id="cancelColumnBtn"
                    style="padding:8px 20px; cursor:pointer; background:#e0e0e0; border:none; border-radius:4px;">Cancel</button>
                <button type="button" id="saveAndNewBtn"
                    style="padding:8px 20px; cursor:pointer; background:#22c55e; color:white; border:none; border-radius:4px; font-weight:500;">Save
                    and New</button>
                <button type="button" id="saveColumnBtn"
                    style="padding:8px 20px; cursor:pointer; background:#4CAF50; color:white; border:none; border-radius:4px;">Save</button>
            </div>
        </form>
        <div id="modalStatus" style="margin-top:10px; padding:8px; display:none; border-radius:4px;"></div>
    </div>

    <script src="/static/client_context.js?v=11"></script>
    <script src="/static/columns.js?v=2"></script>
</body>

</html>
