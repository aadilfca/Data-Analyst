<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Client Data</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>
    <!-- ... rest of the file ... -->
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">🏢 System Analyst</div>
            <div class="nav-user">
                <span>👤 Welcome, Analyst</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <div class="upload-page">
            <div class="upload-header">
                <div class="upload-header-row">
                    <div>
                        <a href="/static/index.html" class="back-link">← Back to Dashboard</a>
                        <h1>📤 Upload Client Data</h1>
                        <p>Upload Excel files to import client data into the system</p>
                    </div>
                    <div class="template-dropdown-container">
                        <label for="templateDropdown">📋 Set Columns</label>
                        <select id="templateDropdown" class="template-dropdown">
                            <option value="new">➕ Add New</option>
                            <!-- Templates will be loaded here -->
                        </select>
                    </div>
                </div>
            </div>

            <div class="upload-box">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📂</div>
                    <h3>Drag & Drop or Click to Upload</h3>
                    <p>Supported formats: .xlsx, .xls</p>
                    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
                    <button class="upload-btn" id="uploadBtn">Choose File</button>
                </div>

                <div id="fileInfo" style="display:none;" class="file-info">
                    <span id="fileName"></span>
                    <span id="fileSize"></span>
                    <button class="clear-btn" id="clearBtn">✕</button>
                </div>

                <div class="upload-actions">
                    <button class="btn-upload" id="submitBtn" disabled>Upload to Server</button>
                    <button class="btn-template" id="templateBtn">📥 Download Template</button>
                </div>

                <div id="uploadStatus" class="upload-status"></div>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- ADD NEW TEMPLATE POPUP -->
    <!-- ============================================= -->
    <div id="popupOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;">
    </div>

    <div id="popupWindow"
        style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:30px; z-index:1000; min-width:600px; max-width:800px; max-height:80vh; overflow-y:auto; border:1px solid #ccc; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.3);">

        <h2>📝 Create New Template</h2>
        <p>Define the columns for your template.</p>

        <!-- Template Name -->
        <div style="margin-bottom:15px;">
            <label><strong>Template Name:</strong></label>
            <input type="text" id="templateName" placeholder="e.g., Sales Invoice"
                style="width:300px; padding:6px; margin-left:10px;">
        </div>

        <!-- Column Table -->
        <table border="1" cellpadding="8" cellspacing="0" style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="background:#f0f0f0;">
                    <th style="width:60px;">Sr No</th>
                    <th style="text-align:left;">Column Name</th>
                    <th style="width:180px;">Type</th>
                    <th style="width:60px;">Action</th>
                </tr>
            </thead>
            <tbody id="columnsBody">
                <!-- Rows inserted by JavaScript -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4" style="text-align:center; padding:10px;">
                        <button onclick="addColumnRow()" style="padding:6px 20px; cursor:pointer;">➕ Click to Add
                            Column</button>
                    </td>
                </tr>
            </tfoot>
        </table>

        <!-- Buttons -->
        <div
            style="margin-top:20px; display:flex; gap:10px; justify-content:space-between; border-top:1px solid #eee; padding-top:15px; align-items:center;">
            <div style="display:flex; gap:10px;">
                <button onclick="document.getElementById('excelFileInput').click()"
                    style="padding:8px 20px; cursor:pointer; background:#3498db; color:white; border:none; border-radius:4px;">
                    📤 Import from Excel
                </button>
                <input type="file" id="excelFileInput" accept=".xlsx,.xls" style="display:none;"
                    onchange="importFromExcel(event)">
            </div>
            <div style="display:flex; gap:10px;">
                <button onclick="closePopup()"
                    style="padding:8px 20px; cursor:pointer; background:#e0e0e0; border:none; border-radius:4px;">Cancel</button>
                <button onclick="saveTemplate()"
                    style="background:#4CAF50; color:white; padding:8px 20px; border:none; cursor:pointer; border-radius:4px;">Save
                    Template</button>
            </div>
        </div>

        <!-- Status Message -->
        <div id="statusMessage" style="margin-top:10px; padding:10px; display:none; border-radius:4px;"></div>
    </div>

    <script src="/static/template_manager.js"></script>
    <script src="/static/upload.js"></script>
</body>

</html>
