<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Clients</title>
    <link rel="stylesheet" href="/static/style.css?v=11">
</head>

<body data-nav-module="Manage Clients">
    <!-- Firm-level navbar. This page is not client-scoped, so it deliberately does NOT use the
         shared client header (#navLeft/#clientControl/.nav-user) every client-scoped page carries -
         no client pill, no 🏢 dashboard icon, no ⊞ quick-nav, no search, no back/up arrows. The
         single #firmNav container below is filled by renderFirmLevelNav() in client_context.js.
         data-nav-parent is deliberately absent: the Up arrow no longer renders here, and its old
         value (index.html) pointed into client territory. -->
    <nav class="navbar firm-navbar">
        <div class="nav-container" id="firmNav">
            <!-- Will be rendered by client_context.js -->
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <header class="module-header">
            <h1>🏢 Manage Clients</h1>
            <p>Add, edit, or delete client entities (companies/organisations)</p>
        </header>

        <!-- Admin area tab strip. Deliberately empty: the tabs, their active state and their
             admin-only gating are all rendered by renderFirmLevelTabs() in client_context.js, the
             same way this page's navbar is rendered by renderFirmLevelNav(). -->
        <div class="firm-tabs" id="firmTabs"></div>

        <!-- Toolbar -->
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
            <button id="addClientBtn" class="btn-upload" style="background:#3b82f6; padding:10px 25px;">➕ Add New
                Client</button>
            <span id="totalClientsLabel" style="font-size:14px; color:#64748b; align-self:center;">Total: <strong
                    id="totalCount">0</strong> clients</span>
        </div>

        <!-- Search Field -->
        <div style="margin-bottom:20px;">
            <input type="text" id="clientSearchInput" placeholder="Search by Code, Name, Industry or Contact"
                style="width:100%; padding:10px 14px; border:2px solid #e2e8f0; border-radius:8px; font-size:14px; transition:border-color 0.2s; max-width:500px;">
        </div>

        <!-- Clients Table -->
        <div style="background:white; border-radius:16px; overflow:auto; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
            <table id="clientsTable" style="width:100%; border-collapse:collapse; font-size:14px;">
                <thead style="background:#f8fafc; border-bottom:2px solid #e2e8f0;">
                    <tr>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="id" class="sortable">
                            ID <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="client_code"
                            class="sortable">
                            Code <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="client_name"
                            class="sortable">
                            Client Name <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="industry"
                            class="sortable">
                            Industry <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="contact_person"
                            class="sortable">
                            Contact <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:center; cursor:pointer;" data-sort="is_active"
                            class="sortable">
                            Active <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:center; cursor:default;">Actions</th>
                    </tr>
                </thead>
                <tbody id="clientsBody">
                    <!-- Rows inserted by JavaScript -->
                </tbody>
            </table>
            <div id="noClientsMessage" style="padding:30px; text-align:center; color:#94a3b8; display:none;">
                No clients found. Click "Add New Client" to create one.
            </div>
        </div>

        <!-- Status Message -->
        <div id="clientStatus" class="upload-status" style="margin-top:20px; display:none;"></div>
    </div>

    <!-- ============================================= -->
    <!-- ADD / EDIT CLIENT MODAL -->
    <!-- ============================================= -->
    <div id="clientModalOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;">
    </div>

    <div id="clientModal"
        style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:30px; z-index:1000; min-width:450px; max-width:600px; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <h2 id="modalTitle">Add New Client</h2>
        <form id="clientForm">
            <div style="margin-bottom:15px;">
                <label><strong>Client Code *</strong></label>
                <input type="text" id="clientCode" placeholder="e.g., ACME001" required
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
                <small style="color:#94a3b8;">Unique identifier for this client (e.g., short code).</small>
            </div>
            <div style="margin-bottom:15px;">
                <label><strong>Client Name *</strong></label>
                <input type="text" id="clientName" placeholder="e.g., ACME Corporation" required
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
            </div>
            <div style="margin-bottom:15px;">
                <label><strong>Industry</strong></label>
                <input type="text" id="clientIndustry" placeholder="e.g., Manufacturing, Retail, IT"
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
            </div>
            <div style="margin-bottom:15px;">
                <label><strong>Contact Person</strong></label>
                <input type="text" id="clientContact" placeholder="e.g., John Doe"
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
            </div>
            <div style="margin-bottom:15px;">
                <label><strong>Email</strong></label>
                <input type="email" id="clientEmail" placeholder="e.g., contact@acme.com"
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
            </div>
            <div style="margin-bottom:15px;">
                <label><strong>Phone</strong></label>
                <input type="text" id="clientPhone" placeholder="e.g., +1 234 567 8900"
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
            </div>
            <input type="hidden" id="editClientId" value="">
            <div
                style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
                <button type="button" id="cancelClientBtn"
                    style="padding:8px 20px; cursor:pointer; background:#e0e0e0; border:none; border-radius:4px;">Cancel</button>
                <button type="button" id="saveAndNewBtn"
                    style="padding:8px 20px; cursor:pointer; background:#22c55e; color:white; border:none; border-radius:4px; font-weight:500;">Save
                    and New</button>
                <button type="button" id="saveClientBtn"
                    style="padding:8px 20px; cursor:pointer; background:#4CAF50; color:white; border:none; border-radius:4px;">Save</button>
            </div>
        </form>
        <div id="modalStatus" style="margin-top:10px; padding:8px; display:none; border-radius:4px;"></div>
    </div>

    <script src="/static/client_context.js?v=8"></script>
    <script src="/static/clients.js?v=4"></script>
</body>

</html>
