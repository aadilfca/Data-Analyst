<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" href="/static/style.css?v=76">
</head>

<body data-nav-module="Manage Users">
    <!-- Firm-level navbar. This page is not client-scoped, so it deliberately does NOT use the
         shared client header (#navLeft/#clientControl/.nav-user) every client-scoped page carries -
         no client pill, no 🏢 dashboard icon, no ⊞ quick-nav, no search, no back/up arrows. The
         single #firmNav container below is filled by renderFirmLevelNav() in client_context.js.
         data-nav-parent is deliberately absent: the Up arrow no longer renders here, and its old
         value (index.html) pointed into client territory. -->
    <nav class="navbar firm-navbar">
        <div class="nav-container" id="firmNav">
            <!-- Will be rendered by client_context.js -->
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <header class="module-header">
            <h1>👥 Manage Users</h1>
            <p>Add, edit, or deactivate user accounts</p>
        </header>

        <!-- Admin area tab strip. Deliberately empty: the tabs, their active state and their
             admin-only gating are all rendered by renderFirmLevelTabs() in client_context.js, the
             same way this page's navbar is rendered by renderFirmLevelNav(). -->
        <div class="firm-tabs" id="firmTabs"></div>

        <!-- Toolbar -->
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
            <button id="addUserBtn" class="btn-upload" style="background:#3b82f6; padding:10px 25px;">➕ Add New
                User</button>
            <span id="totalUsersLabel" style="font-size:14px; color:#64748b; align-self:center;">Total: <strong
                    id="totalCount">0</strong> users</span>
        </div>

        <!-- Search Field -->
        <div style="margin-bottom:20px;">
            <input type="text" id="userSearchInput" placeholder="Search by Username"
                style="width:100%; padding:10px 14px; border:2px solid #e2e8f0; border-radius:8px; font-size:14px; transition:border-color 0.2s; max-width:500px;">
        </div>

        <!-- Users Table -->
        <div style="background:white; border-radius:16px; overflow:auto; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
            <table id="usersTable" style="width:100%; border-collapse:collapse; font-size:14px;">
                <thead style="background:#f8fafc; border-bottom:2px solid #e2e8f0;">
                    <tr>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="id" class="sortable">
                            ID <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="username"
                            class="sortable">
                            Username <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="role"
                            class="sortable">
                            Role <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:center; cursor:pointer;" data-sort="is_active"
                            class="sortable">
                            Active <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:left; cursor:pointer;" data-sort="last_login"
                            class="sortable">
                            Last Login <span class="sort-arrow" style="font-size:12px; margin-left:4px;"></span>
                        </th>
                        <th style="padding:12px 16px; text-align:center; cursor:default;">Actions</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <!-- Rows inserted by JavaScript -->
                </tbody>
            </table>
            <div id="noUsersMessage" style="padding:30px; text-align:center; color:#94a3b8; display:none;">
                No users found. Click "Add New User" to create one.
            </div>
        </div>

        <!-- Status Message -->
        <div id="userStatus" class="upload-status" style="margin-top:20px; display:none;"></div>
    </div>

    <!-- ============================================= -->
    <!-- ADD / EDIT USER MODAL -->
    <!-- ============================================= -->
    <div id="userModalOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;">
    </div>

    <div id="userModal"
        style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:30px; z-index:1000; min-width:450px; max-width:600px; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <h2 id="userModalTitle">Add New User</h2>
        <form id="userForm">
            <div style="margin-bottom:15px;">
                <label><strong>Username *</strong></label>
                <input type="text" id="userUsername" placeholder="e.g., jsmith" required
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
            </div>
            <div id="userPasswordGroup" style="margin-bottom:15px;">
                <label><strong>Password *</strong></label>
                <input type="password" id="userPassword" placeholder="Set an initial password"
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
                <small style="color:#94a3b8;">Only set when creating a user. Use Reset Password to change it later.</small>
            </div>
            <div style="margin-bottom:15px;">
                <label><strong>Role</strong></label>
                <select id="userRole"
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
                    <option value="">Standard User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <input type="hidden" id="editUserId" value="">
            <div
                style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
                <button type="button" id="cancelUserBtn"
                    style="padding:8px 20px; cursor:pointer; background:#e0e0e0; border:none; border-radius:4px;">Cancel</button>
                <button type="button" id="saveAndNewUserBtn"
                    style="padding:8px 20px; cursor:pointer; background:#22c55e; color:white; border:none; border-radius:4px; font-weight:500;">Save
                    and New</button>
                <button type="button" id="saveUserBtn"
                    style="padding:8px 20px; cursor:pointer; background:#4CAF50; color:white; border:none; border-radius:4px;">Save</button>
            </div>
        </form>
        <div id="userModalStatus" style="margin-top:10px; padding:8px; display:none; border-radius:4px;"></div>
    </div>

    <!-- ============================================= -->
    <!-- RESET PASSWORD MODAL -->
    <!-- ============================================= -->
    <div id="resetPasswordOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;">
    </div>

    <div id="resetPasswordModal"
        style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:30px; z-index:1000; min-width:380px; max-width:480px; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <h2 id="resetPasswordTitle">Reset Password</h2>
        <form id="resetPasswordForm">
            <div style="margin-bottom:15px;">
                <label><strong>New Password *</strong></label>
                <input type="password" id="resetPasswordInput" placeholder="Enter a new password" required
                    style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; margin-top:4px;">
            </div>
            <input type="hidden" id="resetPasswordUserId" value="">
            <div
                style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
                <button type="button" id="cancelResetPasswordBtn"
                    style="padding:8px 20px; cursor:pointer; background:#e0e0e0; border:none; border-radius:4px;">Cancel</button>
                <button type="button" id="submitResetPasswordBtn"
                    style="padding:8px 20px; cursor:pointer; background:#4CAF50; color:white; border:none; border-radius:4px;">Reset
                    Password</button>
            </div>
        </form>
        <div id="resetPasswordStatus" style="margin-top:10px; padding:8px; display:none; border-radius:4px;"></div>
    </div>

    <script src="/static/client_context.js?v=22"></script>
    <script src="/static/users.js?v=2"></script>
</body>

</html>
