<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Workbook</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<!-- Audit Workbook — two overlapping change sets: the earlier 2-phase "restyle" (Sr/Voucher No.
     columns replacing the old banner row, then lighter styling in style.css) and the current
     3-phase "restructure" (Phase 1: backend account_name lookup; Phase 2: this markup's Sr/
     Voucher No./Account columns are now rendered via real HTML rowspan — one <td> per voucher
     group, not a blank/repeated-text cell per line — with Account merged into a code+name
     stacked cell; Phase 3: grouping visual treatment in CSS). Column count/structure here is
     unchanged (still 8 columns, awTableBody's rows are entirely JS-rendered — the row below is
     just the initial loading state). Styling polish (hairline borders, zebra striping, lighter
     subtotal row, any dedicated Account cell styling) is Phase 3 — this markup deliberately
     reuses only already-existing global classes
     (.voucher-line-procedures-badge/.voucher-line-obs-flag/etc. from the Verification module,
     .aw-status-badge/.aw-row-clickable already defined below in style.css), no new CSS this
     phase. -->
<body data-nav-module="Audit Workbook" data-nav-parent="verification.html">
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- Populated by renderNavLeft() in client_context.js: back arrow + home link + brand text. -->
            <div id="navLeft"></div>
            <div class="nav-client" id="clientControl">
                <!-- Will be rendered by client_context.js -->
            </div>
            <div class="nav-user">
                <span>👤 Welcome, Analyst</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <header class="module-header">
            <!-- Peer nav bar (Phase 5, FINAL) — mirrors verification.js's own #cashbookBar
                 button pair. "Verification" returns to this exact session (?state=session&id=,
                 same restore path Phase 4's row-click already reuses), not just the generic
                 verification.html landing page a plain link would have gone to. "Audit Workbook"
                 is a static "you are here" indicator (not a real link) since we're already on
                 this page. Both start disabled — audit_workbook.js enables/wires the
                 Verification button once a valid ?session= is confirmed on load. -->
            <div class="aw-nav-buttons">
                <button type="button" class="btn-cashbook" id="awVerificationBtn" disabled><span class="btn-icon">✅</span> Verification</button>
                <span class="btn-cashbook active"><span class="btn-icon">📗</span> Audit Workbook</span>
            </div>
            <h1>📗 Audit Workbook</h1>
            <p id="awSubtitle">Read-only, voucher-level list of verification results for a session.</p>
        </header>

        <!-- Status filter chips — All is active by default. Non-functional this phase; Phase 3
             wires click handlers keyed off each chip's data-status attribute. -->
        <div class="aw-filter-chips">
            <button type="button" class="aw-filter-chip active" id="awFilterAll" data-status="all">All</button>
            <button type="button" class="aw-filter-chip" id="awFilterCleared" data-status="Cleared">Cleared</button>
            <button type="button" class="aw-filter-chip" id="awFilterQuery" data-status="Query">Query</button>
            <button type="button" class="aw-filter-chip" id="awFilterPending" data-status="Pending">Pending</button>
        </div>

        <!-- Table: Sr / Voucher No. / Account / Reference / Amount / Procedures / Observations /
             Status, line-grain. Sr appears only on a voucher's first line; Voucher No. repeats on
             every line of that voucher. An optional subtotal row follows any voucher with more
             than one line. awTableBody's rows are entirely JS-rendered from the Phase 1 endpoint —
             the row below is just the initial loading state so nothing stale flashes before the
             script runs. -->
        <div class="aw-table-wrapper">
            <table class="aw-table">
                <thead>
                    <tr>
                        <th>Sr</th>
                        <th>Voucher No.</th>
                        <th>Account</th>
                        <th>Reference</th>
                        <th>Amount</th>
                        <th>Procedures</th>
                        <th>Observations</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="awTableBody">
                    <tr>
                        <td colspan="8" style="text-align:center; color:#94a3b8;">Loading vouchers…</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="aw-total-row">
                        <td colspan="4">Total</td>
                        <td id="awTotalAmount">0.00</td>
                        <td colspan="2"></td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script src="/static/client_context.js?v=2"></script>
    <script src="/static/audit_workbook.js?v=1"></script>
</body>

</html>
